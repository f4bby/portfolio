[project]
name = "portfolio"
version = "0.1.0"
description = "Portfolio analytics and investment dashboard"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
    "yfinance>=1.6.0",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]